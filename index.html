<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>art · Corentin Bel</title>
<meta name="description" content="Art: a little harbour at dusk where every generative piece is moored somewhere — flow fields, fractals, waves, a sitar tuner, a platform fighter.">
<meta name="theme-color" content="#1a1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1a1030; --cream: #fbeedd; --dim: #c9b3c4; --ink: #160d1c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--cream); }
  body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #scene { width: 100%; height: 100%; display: block; overflow: visible; }
  @media (max-aspect-ratio: 6/5) {
    #stage { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #stage::-webkit-scrollbar { display: none; }
    #scene { width: 165vh; height: 100%; }
    .title h1 { font-size: 24px; }
    .title p { font-size: 12px; background: rgba(26,16,48,.6); padding: 2px 6px; border-radius: 6px; margin-left: -6px; }
    .hint .wide { display: none; }
    .hint .narrow { display: inline; }
  }
  .hint .narrow { display: none; }

  .ink { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .thin { stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .door, .ghost { cursor: pointer; outline: none; }
  .door > g, .ghost > g { transition: filter .25s, transform .25s; transform-box: fill-box; transform-origin: 50% 100%; }
  .door:hover > g, .door:focus-visible > g { filter: drop-shadow(0 0 10px rgba(255, 210, 150, .8)) brightness(1.15); transform: translateY(-3px); }
  .ghost:hover > g, .ghost:focus-visible > g { filter: drop-shadow(0 0 8px rgba(220, 200, 255, .7)); opacity: 1; }
  .sign text { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 13px; font-weight: 600; fill: #3a1e10; }
  .door:hover .sign rect { fill: #ffe6b0; }

  .bob { animation: bob 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { from { transform: translateY(-2px) rotate(-1.4deg); } to { transform: translateY(3px) rotate(1.4deg); } }
  .glow { animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  .twinkle { animation: glow 2.4s ease-in-out infinite; }
  .flow { stroke-dasharray: 16 12; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .note { animation: note 3.6s ease-out infinite; }
  @keyframes note { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(24px, -90px); opacity: 0; } }
  .spin { animation: spin 9s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ghost > g { opacity: .55; }

  .title { position: fixed; left: clamp(14px, 2.4vw, 34px); top: clamp(12px, 2.2vw, 30px); z-index: 5; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .title a { pointer-events: auto; color: var(--dim); text-decoration: none; font-size: 13px; }
  .title a:hover { color: var(--cream); }
  .title h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(26px, 3.4vw, 46px); line-height: 1; margin-top: 6px; }
  .title p { margin-top: 8px; color: var(--dim); font-size: clamp(12px, 1.05vw, 15px); max-width: 30ch; line-height: 1.45; }
  .title p em { font-family: "Fraunces", Georgia, serif; color: var(--cream); }

  #listBtn { position: fixed; right: clamp(12px, 2vw, 28px); top: clamp(12px, 2vw, 26px); z-index: 6; background: rgba(30,18,46,.78); color: var(--cream); border: 1px solid rgba(255,200,150,.4); border-radius: 999px; padding: 8px 14px; font: 600 13px "Inter", sans-serif; cursor: pointer; backdrop-filter: blur(6px); }
  #list { position: fixed; right: clamp(12px, 2vw, 28px); top: 62px; max-height: calc(100% - 80px); overflow-y: auto; z-index: 6; background: rgba(26,16,40,.95); border: 1px solid rgba(255,200,150,.3); border-radius: 14px; padding: 10px; display: none; width: min(340px, calc(100vw - 24px)); box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  #list.open { display: block; }
  #list h3 { font: 600 11px "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #e0a87a; padding: 10px 12px 4px; }
  #list a, #list span { display: block; padding: 8px 12px; border-radius: 9px; color: var(--cream); text-decoration: none; }
  #list span { color: var(--dim); }
  #list a:hover { background: rgba(255,200,150,.12); }
  #list small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }

  #tip { position: fixed; z-index: 7; pointer-events: none; background: rgba(26,16,40,.94); border: 1px solid rgba(255,200,150,.45); border-radius: 10px; padding: 7px 11px; font-size: 13px; opacity: 0; transform: translate(-50%, -130%); transition: opacity .15s; max-width: 340px; }
  #tip b { font-family: "Fraunces", Georgia, serif; font-size: 15px; color: #ffd9a0; font-weight: 600; }
  #tip span { color: var(--dim); display: block; margin-top: 2px; }
  #tip.on { opacity: 1; }

  #pane { position: fixed; z-index: 8; left: clamp(12px, 2.4vw, 34px); bottom: clamp(12px, 2.4vw, 34px); width: min(380px, calc(100vw - 24px)); background: linear-gradient(#2a1a3e, #1c1230); border: 1px solid rgba(255,200,150,.45); border-radius: 16px; padding: 16px 18px 18px; box-shadow: 0 24px 60px rgba(0,0,0,.65); transform: translateY(14px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #pane.open { opacity: 1; transform: none; pointer-events: auto; }
  #pane h2 { font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 600; color: #ffd9a0; padding-right: 26px; }
  #pane .latin { font-family: "Fraunces", Georgia, serif; font-style: italic; color: var(--dim); font-size: 14px; margin-top: 2px; }
  #pane p { margin-top: 10px; font-size: 14px; line-height: 1.55; color: #f0e2e8; }
  #pane .x { position: absolute; right: 12px; top: 10px; background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; }

  .hint { position: fixed; right: clamp(12px, 2vw, 28px); bottom: clamp(10px, 1.6vw, 22px); z-index: 4; color: rgba(251,238,221,.55); font-size: 12px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .bob, .glow, .twinkle, .flow, .note, .spin { animation: none; } }
</style>
</head>
<body>

<div class="title">
  <a href="https://corentinbel.com">← corentinbel.com</a>
  <h1>art</h1>
  <p>A little harbour at dusk. <em>Every piece is moored somewhere.</em></p>
</div>

<div id="stage">

<defs>

  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0806a"/><stop offset=".12" stop-color="#7a4a78"/><stop offset=".55" stop-color="#2e2a5a"/><stop offset="1" stop-color="#16183a"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a27a"/><stop offset="1" stop-color="#8a6448"/>

  <linearGradient id="quayTop" x1="0" y1="0" x2="0" y2="1">

    <feGaussianBlur stdDeviation=".8"/>
  </filter>
  <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>

  <clipPath id="seaClip"><rect x="-1600" y="520" width="4800" height="300"/></clipPath>

</defs>

{

    el("path", { d: "M-20 0 q0 -14 16 -14 h12 l8 -12 q10 2 8 12 l-4 4 q-2 10 -12 10 h-24z", fill: c2, class: "thin" }, h);
    el("path", { d: "M-16 0 v14 M12 0 v14", stroke: c2, "stroke-width": 4 }, h);
    el("path", { d: "M-20 -6 q-8 -2 -10 6", stroke: "#e04848", "stroke-width": 3, fill: "none" }, h);
  }
}
// spiral painted on the canopy, rotating
{
  const c = $("canopy");
  const sp = el("g", { class: "spin", style: "animation-duration:6s" }, null);
  let d = "M0 0";
  for (let a = 0; a < 6 * Math.PI; a += .2) { const r = a * 2.2; d += ` L${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`; }
  el("path", { d, fill: "none", stroke: "#5fd0d8", "stroke-width": 3 }, sp);
  const wrap = el("g", { transform: "translate(230 676) scale(1 .5)" }, c);

}
// bandstand bunting + notes
{
  const g = $("bunting");
  const cols = ["#e04848", "#ffd34a", "#5fd0d8", "#f0a0c0"];
  for (let i = 0; i < 14; i++) { const x = 1214 + i * 21.5, y = 710 + Math.sin(i / 13 * Math.PI) * 14; el("path", { d: `M${x} ${y} l10 0 l-5 12z`, fill: cols[i % 4], class: "thin" }, g); }
  ["♪", "♫", "♪"].forEach((n, i) => el("text", { x: 1376, y: 770, class: "note", style: `animation-delay:${i * 1.2}s` }, $("notes")).textContent = n);
}


/* ============ new places ============ */
// raga dial: eight prahars, day ones warm, night ones blue; a single hand shows the real hour
const PRAHAR_COLS = ["#ffcf8a", "#ffe08a", "#ffd06a", "#f4a05a", "#9a6ab8", "#5a5aa8", "#3a3a7a", "#7a8ac8"]; // from 6:00, every 3 h
{
  const g = $("ragaDial"), cx = 140, cy = 396, r = 19;
  el("circle", { cx, cy, r: r + 3, fill: "#fbeedd", class: "ink" }, g);
  for (let k = 0; k < 8; k++) {
    const a0 = (k * 45 - 90 + 90) * Math.PI / 180, a1 = ((k + 1) * 45 - 90 + 90) * Math.PI / 180; // 6:00 at the bottom? no: 24h dial, midnight at top
    const b0 = ((6 + k * 3) / 24) * 2 * Math.PI - Math.PI / 2, b1 = ((9 + k * 3) / 24) * 2 * Math.PI - Math.PI / 2;
    el("path", { d: `M${cx} ${cy} L${(cx + r * Math.cos(b0)).toFixed(2)} ${(cy + r * Math.sin(b0)).toFixed(2)} A${r} ${r} 0 0 1 ${(cx + r * Math.cos(b1)).toFixed(2)} ${(cy + r * Math.sin(b1)).toFixed(2)}z`, fill: PRAHAR_COLS[k], stroke: "#160d1c", "stroke-width": .6 }, g);
  }
  el("circle", { cx, cy: cy - r + 6, r: 2.6, fill: "#f6f2e6" }, g);
  el("circle", { cx, cy: cy + r - 6, r: 3, fill: "#ffd34a", stroke: "#b8442a", "stroke-width": .8 }, g);
  el("path", { id: "ragaHand", d: "", stroke: "#160d1c", "stroke-width": 2.2, "stroke-linecap": "round" }, g);
  el("circle", { cx, cy, r: 2.4, fill: "#160d1c" }, g);
}
// cumulus: flat base, cauliflower top
{
  const g = $("cumulus");
  const base = 236, x0 = 1376, x1 = 1556;
  el("ellipse", { cx: 1466, cy: base + 6, rx: 100, ry: 10, fill: "#b86a7a", opacity: .4 }, g);
  const puffs = [[1402, 214, 22], [1432, 196, 32], [1470, 178, 40], [1508, 196, 30], [1534, 214, 20], [1452, 160, 26], [1490, 152, 22], [1470, 212, 26]];
  for (const [x, y, r] of puffs) el("circle", { cx: x, cy: y, r: r + 2.5, fill: "#160d1c" }, g);
  for (const [x, y, r] of puffs) el("circle", { cx: x, cy: y, r, fill: "#fde3d0" }, g);
  for (const [x, y, r] of puffs) el("circle", { cx: x - r * .25, cy: y - r * .3, r: r * .55, fill: "#fff4ea", opacity: .8 }, g);
  const bd = `M${x0 + 6} ${base + 4} Q${x0 - 6} ${base - 14} ${x0 + 20} ${base - 18} H${x1 - 20} Q${x1 + 6} ${base - 14} ${x1 - 6} ${base + 4}z`;
  el("path", { d: bd, fill: "#fde3d0" }, g);
  el("path", { d: `M${x0 + 6} ${base + 4} H${x1 - 6}`, stroke: "#160d1c", "stroke-width": 2.5, "stroke-linecap": "round" }, g);
  el("path", { d: `M${x0 + 14} ${base} H${x1 - 14}`, stroke: "#e0a8a4", "stroke-width": 4, "stroke-linecap": "round" }, g);
  // a thermal: faint rising spirals under the base
  for (let i = 0; i < 3; i++) el("path", { d: `M${1440 + i * 18} 400 q-10 -40 6 -80 q14 -40 -2 -70`, fill: "none", stroke: "#ffe8d0", "stroke-width": 1.4, "stroke-dasharray": "3 7", opacity: .45, class: "flow" }, g);
}
// floral clock: twelve flower clumps round the rim, real local time on the hands
{
  const g = $("floralRing");
  const cols = ["#ff6a8a", "#ffd34a", "#f6f2e6", "#b88ae0", "#ff9a4a", "#7ad0ff"];
  el("ellipse", { cx: 800, cy: 905, rx: 72, ry: 16, fill: "#5f9a4a", stroke: "#2f5a2a", "stroke-width": 1 }, g);
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * 2 * Math.PI - Math.PI / 2;
    const x = 800 + Math.cos(a) * 92, y = 905 + Math.sin(a) * 21;
    for (let j = 0; j < 4; j++) el("circle", { cx: (x + rr(-6, 6)).toFixed(1), cy: (y + rr(-3, 3)).toFixed(1), r: rr(2.4, 3.6).toFixed(1), fill: cols[k % 6], stroke: "#160d1c", "stroke-width": .6 }, g);
    if (k % 3 === 0) el("path", { d: `M${(800 + Math.cos(a) * 80).toFixed(1)} ${(905 + Math.sin(a) * 18).toFixed(1)} L${(800 + Math.cos(a) * 86).toFixed(1)} ${(905 + Math.sin(a) * 19.4).toFixed(1)}`, stroke: "#fbeedd", "stroke-width": 2 }, g);
  }
  for (let i = 0; i < 40; i++) { const a = R() * 6.28, d = Math.sqrt(R()) * .8; el("circle", { cx: (800 + Math.cos(a) * d * 70).toFixed(1), cy: (905 + Math.sin(a) * d * 15).toFixed(1), r: 1.2, fill: pick(["#ffe08a", "#ffffff", "#ffb0c8"]) }, g); }
}
const floralHands = $("floralHands");
function drawFloralHands() {
  const now = new Date(), h = now.getHours() % 12 + now.getMinutes() / 60, m = now.getMinutes() + now.getSeconds() / 60;
  floralHands.textContent = "";
  for (const [v, len, w, c] of [[h / 12, 44, 5, "#2a1830"], [m / 60, 66, 3.4, "#2a1830"]]) {
    const a = v * 2 * Math.PI - Math.PI / 2, x = 800 + Math.cos(a) * len, y = 905 + Math.sin(a) * len * .23;
    el("path", { d: `M800 905 L${x.toFixed(1)} ${y.toFixed(1)}`, stroke: c, "stroke-width": w, "stroke-linecap": "round" }, floralHands);
  }
  el("ellipse", { cx: 800, cy: 905, rx: 5, ry: 3, fill: "#d6a94f", stroke: "#160d1c", "stroke-width": 1 }, floralHands);
}
drawFloralHands(); setInterval(drawFloralHands, 20000);
// glowing mushrooms on the log
{
  const g = $("logShrooms");
  for (const [x, hgt, w, c] of [[414, 18, 16, "#7dffcf"], [436, 28, 24, "#b8fff0"], [462, 16, 14, "#a9ffe0"], [486, 24, 20, "#7dffcf"], [508, 14, 12, "#b8fff0"]]) {
    el("rect", { x: x - w * .14, y: 898 - hgt, width: w * .28, height: hgt, rx: 2, fill: "#e8f5ee", class: "thin" }, g);
    el("path", { d: `M${x - w / 2} ${898 - hgt + 2} q${w / 2} -${w * .9} ${w} 0z`, fill: c, class: "thin glow", style: `animation-delay:-${rr(0, 3).toFixed(1)}s` }, g);
    el("circle", { cx: x - w * .15, cy: 898 - hgt - w * .2, r: w * .08, fill: "#fff", opacity: .8 }, g);
  }
}
// blacked-out posters on the column
{
  const g = $("posters");
  for (const [y, h, c] of [[834, 40, "#f6e0b0"], [878, 44, "#fbeedd"]]) {
    el("rect", { x: 1062, y, width: 36, height: h, fill: c, stroke: "#8a6a44", "stroke-width": 1 }, g);
    el("rect", { x: 1066, y: y + 5, width: 28, height: 6, fill: "#1a1a1a" }, g);
    for (let k = 0; k < Math.floor((h - 16) / 6); k++) el("rect", { x: 1066, y: y + 15 + k * 6, width: rr(10, 28).toFixed(0), height: 3.4, fill: R() < .7 ? "#1a1a1a" : "#b8442a" }, g);
  }
}
// the lighthouse's brain
{
  const g = $("lhBrain");
  el("ellipse", { cx: 1196, cy: 338, rx: 30, ry: 26, fill: "url(#brainGlow)", class: "glow" }, g);
  el("path", { d: "M1196 330 c-9 -3 -14 4 -12 9 c1 5 7 8 13 6 c6 -1 9 -6 7 -11 c-2 -4 -5 -5 -8 -4z", fill: "#f4b0c0", stroke: "#160d1c", "stroke-width": 1.2 }, g);
  el("path", { d: "M1188 339 q3 -3 6 0 q3 3 6 0 M1191 344 q3 -2 6 0", fill: "none", stroke: "#b9606f", "stroke-width": 1 }, g);
}
const ragaHand = $("ragaHand"), glider = $("glider");
function drawRagaHand() {
  const now = new Date(), t = (now.getHours() + now.getMinutes() / 60) / 24 * 2 * Math.PI - Math.PI / 2;
  ragaHand.setAttribute("d", `M140 396 L${(140 + Math.cos(t) * 15).toFixed(1)} ${(396 + Math.sin(t) * 15).toFixed(1)}`);
}
drawRagaHand(); setInterval(drawRagaHand, 60000);

/* ============ animation ============ */
const horses = [...document.querySelectorAll(".horse")];
const nix = $("fighterNix"), bram = $("fighterBram");
const fight = [{ e: nix, x: 1080, y: 648, vy: 0, dmg: 0, t: $("pctNix") }, { e: bram, x: 1160, y: 648, vy: 0, dmg: 0, t: $("pctBram") }];
const beam = $("beamA");
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;

  // the paraglider circles in the thermal, drifting up and down a little
  const ga = T * .45;
  glider.setAttribute("transform", `translate(${(1466 + Math.cos(ga) * 46).toFixed(1)} ${(300 + Math.sin(ga) * 9 + Math.sin(T * .2) * 6).toFixed(1)}) rotate(${(Math.sin(ga) * -14).toFixed(1)}) scale(${(.92 + Math.sin(ga) * .08).toFixed(3)})`);
  // lighthouse beam sweeps
  const ang = Math.sin(T * .6) * 30;
  beam.setAttribute("transform", `rotate(${ang.toFixed(1)} 1196 352)`);
  beam.setAttribute("opacity", (.35 + .35 * Math.abs(Math.cos(T * .6))).toFixed(2));
  // clouds, gulls, ripples
  for (const c of clouds) { c.x = (c.x + c.v * dt) % 2000; c.g.setAttribute("transform", `translate(${(c.x > 1000 ? c.x - 2000 : c.x).toFixed(1)} 0)`); }
  for (const g of gulls) {
    g.x += g.v * dt; if (g.x > 1700) g.x = -100; g.p += dt * 6;
    const f = Math.sin(g.p) * 6 * g.s, w = 12 * g.s;
    g.e.setAttribute("d", `M${(g.x - w).toFixed(1)} ${(g.y - f).toFixed(1)} Q${(g.x - w / 2).toFixed(1)} ${(g.y - 6 * g.s).toFixed(1)} ${g.x.toFixed(1)} ${g.y.toFixed(1)} Q${(g.x + w / 2).toFixed(1)} ${(g.y - 6 * g.s).toFixed(1)} ${(g.x + w).toFixed(1)} ${(g.y - f).toFixed(1)}`);
  }
  for (const r of ripples) { r.x += r.v * dt; if (r.x > 1700) r.x = -100; r.e.setAttribute("transform", `translate(${r.x.toFixed(1)} ${(r.y + Math.sin(T + r.x * .01) * 1.5).toFixed(1)})`); }
  // carousel horses go up and down
  horses.forEach((h, i) => h.setAttribute("transform", `translate(${h.dataset.x} ${(800 + Math.sin(T * 2 + i * 2) * 12).toFixed(1)})`));
  // ring
  for (const f of fight) {
    if (f.vy === 0 && R() < dt * .9) f.vy = -rr(60, 110);
    f.vy += 300 * dt; f.y += f.vy * dt; if (f.y > 648) { f.y = 648; f.vy = 0; }
    f.x += Math.sin(T * 1.4 + (f === nix ? 0 : 2)) * 16 * dt; f.x = Math.max(1050, Math.min(1190, f.x));
    f.e.setAttribute("transform", `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)})`);
  }
  if (R() < dt * .5) { const f = pick(fight); f.dmg += Math.round(rr(4, 18)); if (f.dmg > 150) fight.forEach(q => q.dmg = 0); }
  fight.forEach(f => f.t.textContent = f.dmg + "%");
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ tooltip + pane ============ */
const tip = $("tip"), pane = $("pane");
document.querySelectorAll(".door, .ghost").forEach(a => {
  a.addEventListener("pointerenter", () => {
    if (a.classList.contains("door")) { tip.querySelector("b").textContent = a.dataset.label + " →"; tip.querySelector("span").textContent = a.dataset.sub; }
    else { tip.querySelector("b").textContent = SOON[a.dataset.info].t; tip.querySelector("span").textContent = "on the horizon · click to read"; }
    tip.classList.add("on");
  });
  a.addEventListener("pointerleave", () => tip.classList.remove("on"));
});
addEventListener("pointermove", e => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });
function openPane(key) {
  const i = SOON[key];
  pane.querySelector("h2").textContent = i.t; pane.querySelector(".latin").textContent = "coming soon"; pane.querySelector("p").textContent = i.p;
  pane.classList.add("open");
}
document.querySelectorAll(".ghost").forEach(a => {
  a.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openPane(a.dataset.info); });
  a.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPane(a.dataset.info); } });
});
pane.querySelector(".x").addEventListener("click", () => pane.classList.remove("open"));
$("stage").addEventListener("click", e => { if (!e.target.closest(".ghost")) pane.classList.remove("open"); });
const list = $("list"), listBtn = $("listBtn");
listBtn.addEventListener("click", () => { const o = list.classList.toggle("open"); listBtn.setAttribute("aria-expanded", o); });
addEventListener("keydown", e => { if (e.key === "Escape") { pane.classList.remove("open"); list.classList.remove("open"); } });
const stage = $("stage");
if (stage.scrollWidth > stage.clientWidth) stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) * .5;
</script>
